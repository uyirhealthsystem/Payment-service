name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # unit tests (surefire) + *IT integration tests (failsafe, Testcontainers Postgres via the runner's Docker)
      - name: Run tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-payment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build jar
        run: |
          ./mvnw -B -DskipTests package
          mv target/payment-service-*.jar target/app.jar

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: target/app.jar
          target: /opt/payment
          strip_components: 1

      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart payment
            # wait up to 60s for the readiness probe (includes the DB check)
            for i in $(seq 1 30); do
              if curl -fs http://127.0.0.1:8082/actuator/health/readiness > /dev/null; then
                echo "payment service is up"
                exit 0
              fi
              sleep 2
            done
            echo "payment service did not become ready"
            sudo journalctl -u payment -n 100 --no-pager
            exit 1
