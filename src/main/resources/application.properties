spring.application.name=payment-service
# Self-contained: no default points at another service or at localhost. Every environment-specific value comes
# from the environment, and startup fails fast with a clear message when a required one is missing.
# Local development defaults live in application-local.properties.
# Optional local secrets (e.g. PAYMENT_GATEWAY_SECRET) from a gitignored .env in the working directory
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8082}
# Behind the gateway / ingress: trust X-Forwarded-* so redirects and logged URLs are correct
server.forward-headers-strategy=framework
# Finish in-flight requests on SIGTERM (rolling deploys)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- PostgreSQL owned by this service alone: payments, checkouts, refunds, callback outbox ---
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000
# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Who is calling. Set at least one of PAYMENT_GATEWAY_SECRET / AUTH_JWKS_URL (startup fails otherwise). ---
# Via the api-gateway (production): the gateway verifies the JWT and forwards X-User-Id / X-User-Role with
# X-Gateway-Secret. When that secret matches this one (>= 32 chars, the gateway's PAYMENT_GATEWAY_SECRET), the
# headers are trusted and no JWT is checked here. Headers without the matching secret are ignored.
payment.security.gateway-secret=${PAYMENT_GATEWAY_SECRET:}
# DEVELOPMENT ONLY: believe X-User-Id / X-User-Role without the secret. Anyone who can reach the service can then
# act as any user, so never enable it on a reachable instance.
payment.security.trust-identity-headers=${TRUST_IDENTITY_HEADERS:false}
# Callers that skip the gateway (e.g. another service calling directly with the user's bearer token): RS256 JWTs
# verified against the identity provider's JWKS. Keys are fetched lazily, so startup never waits for it.
# Leave empty for a gateway-only deployment: bearer tokens are then rejected.
payment.security.jwks-uri=${AUTH_JWKS_URL:}
# Instead of a JWKS: a fixed PEM public key (local testing, see application-local.properties)
payment.security.public-key-location=${AUTH_PUBLIC_KEY_LOCATION:}
# Same as the gateway: only enforced when set (auth service tokens carry no fixed issuer)
payment.security.issuer=${JWT_ISSUER:}
payment.security.role-claim=role
payment.security.admin-roles=ADMIN,SUPER_ADMIN

# --- Provider: razorpay = Razorpay (default); mock = local testing only, every payment succeeds immediately ---
payment.provider=${PAYMENT_PROVIDER:razorpay}
payment.currency=INR

# --- Razorpay (Payment Links). See README "Razorpay setup". Test-mode keys (rzp_test_...) for staging. ---
payment.razorpay.api-base-url=${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
# true = real money. Live keys (rzp_live_...) are refused unless it is set, test keys (rzp_test_...) when it is
payment.razorpay.live=${RAZORPAY_LIVE:false}
# Optional (acc_..., Dashboard > Account & Settings): webhooks for any other Razorpay account are ignored
payment.razorpay.account-id=${RAZORPAY_ACCOUNT_ID:}
# how long a checkout link stays payable (Razorpay requires more than 15 minutes)
payment.razorpay.link-expiry=20m

# --- Where the browser goes after paying on the Razorpay checkout page (Razorpay appends the result as query
# parameters). The app should then call POST /api/payments/{id}/refresh or poll GET /api/payments/{id}.
payment.checkout.success-url=${CHECKOUT_SUCCESS_URL:}

# --- Modules that take payments. Key = referenceType they send. Each gets the result POSTed to its
# webhook-url, signed with its webhook-secret (X-Payment-Timestamp / X-Payment-Signature).
# With a real provider, a referenceType accepts payments only once its webhook-url is set, so money is never
# collected for a module that would not hear about it.
# Add a module: two lines here (+ optional return-url) and the matching secret on the module's side, or without a
# rebuild in an external config/application.properties next to the jar (Spring Boot loads it automatically).
# Any other referenceType is refused with 400 "Unknown referenceType". Next to add, e.g. ambulance:
#   payment.consumers[AMBULANCE_BOOKING].webhook-url=${AMBULANCE_PAYMENT_WEBHOOK_URL:}
#   payment.consumers[AMBULANCE_BOOKING].webhook-secret=${AMBULANCE_PAYMENT_WEBHOOK_SECRET:}
# Hospital doctor seats -> hospitalservice POST /api/v1/hospital/seats/payments/webhook (its PAYMENT_WEBHOOK_SECRET)
payment.consumers[HOSPITAL_SEAT].webhook-url=${HOSPITAL_SEAT_PAYMENT_WEBHOOK_URL:}
payment.consumers[HOSPITAL_SEAT].webhook-secret=${HOSPITAL_SEAT_PAYMENT_WEBHOOK_SECRET:}
# Teleconsultation (TCS) appointments -> TCS POST /api/teleconsultation/payments/webhook (docs/IMPLEMENTATION_GUIDE.md)
payment.consumers[TELECONSULTATION].webhook-url=${TELECONSULT_PAYMENT_WEBHOOK_URL:}
payment.consumers[TELECONSULTATION].webhook-secret=${TELECONSULT_PAYMENT_WEBHOOK_SECRET:}
# optional: where the browser goes after checkout (empty = CHECKOUT_SUCCESS_URL)
payment.consumers[TELECONSULTATION].return-url=${TELECONSULT_PAYMENT_RETURN_URL:}

# --- Result callbacks to the modules: retried 10s, 20s, 40s ... up to 1h apart, 12 attempts (~5h) ---
payment.delivery.poll-interval=3s
payment.delivery.max-attempts=12
payment.delivery.initial-backoff=10s
payment.delivery.max-backoff=1h
spring.flyway.enabled=true
# --- Safety net for lost Razorpay webhooks: ask Razorpay about checkouts open for more than 3 minutes ---
payment.reconcile.enabled=true
payment.reconcile.interval=60s
payment.reconcile.after=3m
# Refunds stuck PENDING (refund call timed out, or refund.* webhook lost) are looked up every 15 minutes; one that
# Razorpay still does not know 30 minutes after it was requested is marked FAILED, so it can be requested again
payment.reconcile.refund-after=15m
payment.reconcile.refund-not-found-after=30m
payment.reconcile.give-up-after=24h

spring.mvc.problemdetails.enabled=true

# --- Ops: K8s probes (readiness includes DB), Prometheus metrics ---
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
# JSON logs in production: LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (set in the Dockerfile)

# --- Linked accounts (Razorpay Route): businesses paid their share straight into their own bank account.
# Route must be enabled on the Razorpay account. Key = ownerType a module sends, value = the role its caller must
# have; a caller onboards only their own account. Add the product.route.* events to the Razorpay webhook.
payment.linked-accounts.owner-roles[HOSPITAL]=HOSPITAL
payment.linked-accounts.claim-timeout=2m
# accounts still in review are looked up at Razorpay this long after their last change (lost webhooks)
payment.linked-accounts.refresh-after=10m
payment.linked-accounts.refresh-interval=10m
