# Run with: ./mvnw spring-boot:run "-Dspring-boot.run.profiles=local"
# LOCAL TESTING ONLY. NEVER use this profile in a real environment.
# Needs nothing but this service's own Postgres (docker compose up -d): no auth service, no Razorpay, no modules.

# Postgres from this repo's docker-compose.yml
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/payment}
spring.datasource.username=${DB_USER:payment}
spring.datasource.password=${DB_PASS:payment}

# Identity the way the api-gateway sends it, without the gateway: just set the headers yourself.
#   curl -H "X-User-Id: patient-42" -H "X-User-Role: PATIENT" ...        (refunds: X-User-Role: ADMIN)
payment.security.trust-identity-headers=${TRUST_IDENTITY_HEADERS:true}
# Bearer tokens too (optional): this repo's throw-away dev key. "node scripts/dev-jwt.mjs patient-42 PATIENT"
# mints a token and creates dev-keys/ on first use; without dev-keys/ only the headers work. To accept tokens
# from another module running locally, point AUTH_PUBLIC_KEY_LOCATION at the key that module signs with.
payment.security.public-key-location=${AUTH_PUBLIC_KEY_LOCATION:file:dev-keys/dev-public.pem}

# No Razorpay account needed: every checkout is paid at once. Set PAYMENT_PROVIDER=razorpay (plus RAZORPAY_*
# variables, test-mode keys) to use a real test-mode account.
payment.provider=${PAYMENT_PROVIDER:mock}
# false: mock checkouts stay PENDING until a signed Razorpay webhook is simulated (docs/postman collection)
payment.mock.auto-pay=${PAYMENT_MOCK_AUTO_PAY:true}
# Lets the Postman collection sign simulated Razorpay webhooks (POST /api/payments/webhooks/razorpay). Real ones
# use the secret entered in the Razorpay dashboard.
payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:local-razorpay-webhook-secret}

payment.checkout.success-url=${CHECKOUT_SUCCESS_URL:http://localhost:3000/payments/result}

# Result callbacks: hospital is not called unless you set HOSPITAL_SEAT_PAYMENT_WEBHOOK_URL (e.g.
# http://localhost:8081/api/v1/hospital/seats/payments/webhook). The secret must equal hospitalservice's
# PAYMENT_WEBHOOK_SECRET.
payment.consumers[HOSPITAL_SEAT].webhook-secret=${HOSPITAL_SEAT_PAYMENT_WEBHOOK_SECRET:local-hospital-seat-secret}
